services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: social-media-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: social_media
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: social-media-app
    ports:
      - "4000:4000"
    environment:
      # Override DATABASE_URL to connect to the db service
      DATABASE_URL: postgresql://postgres:postgres@db:5432/social_media?sslmode=disable
      PORT: 4000
      NODE_ENV: production
      PGPASSWORD: postgres
    env_file:
      - .env
    volumes:
      # Mount migration files and entrypoint script for local development
      - ./src/db/migrations:/app/src/db/migrations:ro
      - ./docker-entrypoint.sh:/app/docker-entrypoint.sh:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["node", "dist/src/index.js"]

volumes:
  postgres_data:
